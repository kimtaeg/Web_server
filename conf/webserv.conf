# cwebserv sample configuration.
# Every directive can also be given on the command line with  -s 'directive args'.
listen 8080
bind 127.0.0.1            # the forward proxy below is on: do not expose it publicly
root ./www
index index.html
threads 8
max_connections 4096
keepalive_timeout 5       # seconds an idle keep-alive connection is kept
request_timeout 10        # seconds to receive one complete request (slowloris guard)
max_keepalive_requests 1000
max_body_size 10m

# Dynamic content: executables in ./cgi-bin answer URLs under /cgi-bin
cgi /cgi-bin ./cgi-bin
cgi_timeout 5000          # ms

# Reverse proxy: backend pools and routing rules
upstream api 127.0.0.1:9001 127.0.0.1:9002   # round-robin
upstream app 127.0.0.1:9003
route /api api strip      # /api/users -> backend /users
route_host app.localhost app
proxy_connect_timeout 1000
proxy_timeout 5000
fail_timeout 10           # a failed backend is skipped for 10 s

# Forward proxy (curl -x http://127.0.0.1:8080 http://example.com/) with an LRU cache
forward_proxy on
cache on
cache_size 64m
cache_max_object 1m
cache_ttl 60

status_page on            # GET /__status
access_log on
