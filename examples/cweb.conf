# examples/cweb.conf — 데모 설정 (저장소 루트에서 실행: ./build/release/webserver -f examples/cweb.conf)
listen   0.0.0.0:8080
root     ./examples/www
cgi      /cgi-bin ./build/release/cgi-bin
workers  16
queue    256
header_timeout_ms 10000

# 리버스 프록시: /api → 백엔드 2개 (README 의 --name A/B 예시)
route /api 127.0.0.1:9001 127.0.0.1:9002
upstream_connect_timeout_ms 1000
upstream_read_timeout_ms    5000
upstream_down_secs          10

# 포워드 프록시 + 캐시 (curl -x localhost:8080 http://...)
forward_proxy on
cache_max_bytes        67108864
cache_max_object_bytes 1048576
cache_default_ttl_secs 60
