<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>docs</title><link rel="stylesheet" href="/css/style.css"></head>
<body><main class="wrap"><section>
  <h2>/docs/ — 디렉터리의 index.html</h2>
  <p>URL 이 <code>/</code> 로 끝나는 디렉터리는 <code>index.html</code> 을 돌려준다. <code>/docs</code> 로 들어오면 301 로 <code>/docs/</code> 에 보낸다.</p>
  <p><a href="/">처음으로</a></p>
</section></main></body>
</html>
